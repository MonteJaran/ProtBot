[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protbot"
version = "1.0.0"   # keep in sync with core/version.py (a test enforces this)
description = "Windows application usage tracker and limiter"
requires-python = ">=3.10"
# Proprietary, all rights reserved. Stated explicitly because a project with
# no licence field reads as "the author forgot", and some tooling treats the
# absence as permission. See LICENSE.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# No "License ::" trove classifier: newer setuptools rejects one alongside the
# PEP 639 `license` expression above as redundant/conflicting (caught only by
# actually building the package -- see AUDIT ST-04, which this pyproject.toml
# had never done before).
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
    "plyer>=2.1.0",
]

# `pip install -e .` puts `protbot` on PATH and makes `core`/`ui` importable
# from any working directory -- see main.py, which used to sys.path.insert
# its own directory to get the same effect (AUDIT ST-04).
[project.scripts]
protbot = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Two independent implementations, used only to check core/qrcode.py.
    # A hand-written encoder cannot be verified by looking at its output, so
    # the tests read symbols back with a real decoder and compare against a
    # second encoder. Neither is imported by the app or shipped in a build.
    "segno>=1.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
]

[tool.setuptools]
# Explicit, not autodiscovery: the repo root also holds tests/, android/,
# packaging/ and server/ (a separate deployable, not part of the desktop
# app), none of which belong in the installed package.
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["core/apps_list.py"]   # generated data table, not hand-edited logic

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "B",    # bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "B008",   # tkinter idioms call functions in defaults
    # Percent-formatting in UI display strings. Purely cosmetic, and the
    # rewrite cannot be verified without running the GUI. Drop this ignore
    # and convert them when the UI is next touched.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path setup must precede imports
