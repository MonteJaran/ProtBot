# The project was importable only because main.py inserted its own directory
# into sys.path (AUDIT ST-04). It declares a build backend now, so it can be
# installed like anything else and the hack is gone.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protbot"
version = "1.0.0"   # keep in sync with core/version.py (a test enforces this)
description = "Windows application usage tracker and limiter"
requires-python = ">=3.10"
# Proprietary, all rights reserved. Stated explicitly because a project with
# no licence field reads as "the author forgot", and some tooling treats the
# absence as permission. See LICENSE.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    # No "License :: ..." classifier. PEP 639 superseded those with the
    # `license` expression above, and setuptools now refuses to build a
    # project that carries both — which is why this could not be packaged
    # until someone tried.
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
    "plyer>=2.1.0",
]

# A GUI entry point, not a console one: on Windows `gui-scripts` produces a
# launcher built on pythonw.exe, so starting ProtBot does not also open a
# console window that stays for the life of the app.
[project.gui-scripts]
protbot = "ui.launcher:main"

[tool.setuptools]
# Listed rather than discovered. Automatic discovery at the repository root
# also finds `tests`, `packaging` and `server` — none of which belong in an
# install, and `server` least of all: it is the wire contract for a service,
# not part of the application.
packages = ["core", "ui"]

# No package-data. `ProtBot.ico` and `PRIVACY.md` sit at the repository root
# rather than inside a package, so a wheel does not carry them — and it does
# not need to. The shipping artifact is the PyInstaller build, whose spec
# bundles both explicitly; the wheel exists so the project is installable and
# `main.py` no longer has to edit sys.path. Both call sites already degrade
# when the files are absent: `core.tray` passes an empty icon path and shows
# no icon, and `core.consent.open_policy` falls back to the published URL.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Two independent implementations, used only to check core/qrcode.py.
    # A hand-written encoder cannot be verified by looking at its output, so
    # the tests read symbols back with a real decoder and compare against a
    # second encoder. Neither is imported by the app or shipped in a build.
    "segno>=1.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["core/apps_list.py"]   # generated data table, not hand-edited logic

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "B",    # bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "B008",   # tkinter idioms call functions in defaults
    # Percent-formatting in UI display strings. Purely cosmetic, and the
    # rewrite cannot be verified without running the GUI. Drop this ignore
    # and convert them when the UI is next touched.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path setup must precede imports
