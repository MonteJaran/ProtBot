[build-system]
# setuptools, not because this ships to PyPI (it does not — see the licence
# below), but so `pip install -e .` makes core/ and ui/ real importable
# packages. AUDIT ST-04: before this, main.py reached them with
# sys.path.insert, which only worked because main.py happens to sit at the
# repo root beside them — a script one directory deeper (as several under
# packaging/ are) needs its own, and keeps it; that is a different, correct
# use of the same trick, not the one this fixes.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protbot"
version = "1.0.0"   # keep in sync with core/version.py (a test enforces this)
description = "Windows application usage tracker and limiter"
requires-python = ">=3.10"
# Proprietary, all rights reserved. Stated explicitly because a project with
# no licence field reads as "the author forgot", and some tooling treats the
# absence as permission. See LICENSE.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    # No "License ::" classifier alongside it: PEP 639 says the license
    # expression above replaces those, and current setuptools enforces it —
    # `pip install -e .` refused to build with both present, caught by
    # actually running it rather than assumed. See AUDIT ST-04, STATUS.md.
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
    "plyer>=2.1.0",
]

[project.scripts]
protbot = "main:main"

[tool.setuptools]
# The importable surface, and no more: not tests/, android/, packaging/ or
# server/ (server/ is the separate Cloud Functions deployment — see
# STATUS.md — and is never imported by this app; core/dataexport.py etc.
# never touch it).
py-modules = ["main"]
packages = ["core", "ui"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Two independent implementations, used only to check core/qrcode.py.
    # A hand-written encoder cannot be verified by looking at its output, so
    # the tests read symbols back with a real decoder and compare against a
    # second encoder. Neither is imported by the app or shipped in a build.
    "segno>=1.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    # Generates the SBOM tests/test_sbom.py checks and the sbom CI job
    # publishes, for the EU Cyber Resilience Act — see STATUS.md. Not
    # imported by the app and not shipped in a build.
    "cyclonedx-bom>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["core/apps_list.py"]   # generated data table, not hand-edited logic

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "B",    # bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "B008",   # tkinter idioms call functions in defaults
    # Percent-formatting in UI display strings. Purely cosmetic, and the
    # rewrite cannot be verified without running the GUI. Drop this ignore
    # and convert them when the UI is next touched.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path setup must precede imports
