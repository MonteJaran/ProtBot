name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Linux runs the same suite because it
        # is faster and catches anything that is accidentally platform-locked.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # segno and OpenCV verify core/qrcode.py: the tests read generated
        # symbols back with a real decoder and compare against a second
        # encoder. Without them those tests skip, which would let a broken
        # QR encoder through a green build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest segno opencv-python-headless numpy

      - name: Run tests
        run: python -m pytest -v

  syntax:
    name: Syntax check (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Byte-compile every module
        # Catches syntax errors in the Tk UI modules, which the test suite does
        # not import because CI runners have no display.
        run: python -m compileall -q core ui server main.py

  dependencies:
    name: Dependency install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        # requirements.txt is what users actually install. If it drifts from
        # what the code imports, this job fails before a user hits it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import every runtime dependency
        # pystray and Pillow were dropped in favour of core/tray.py (ctypes),
        # so importing them here would now fail. Keep this list matching
        # requirements.txt.
        run: python -c "import psutil, plyer; print('runtime deps OK')"

      - name: Verify the packaging config
        # PyInstaller and Inno Setup cannot run here, but the spec, the
        # installer script and the launcher can be checked for drift.
        run: |
          python -m pip install pytest
          python -m pytest tests/test_packaging_build.py -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit the pinned dependencies
        # requirements.lock is what a release actually installs, so it is what
        # gets audited. Pinning by hash makes builds reproducible and also
        # freezes any advisory published after the pin was taken — this job is
        # what stops that going unnoticed.
        run: pip-audit --requirement requirements.lock --strict --progress-spinner off

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        # The project declares a build backend (AUDIT ST-04). Nothing had ever
        # tried to use it, which is how a "License ::" classifier alongside the
        # PEP 639 license expression sat in pyproject.toml making the project
        # unbuildable. Building here is what stops that happening again.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it and check the entry point exists
        run: |
          python -m pip install dist/*.whl
          python -c "import importlib.metadata as m; \
            eps = m.entry_points(group='gui_scripts'); \
            assert any(e.name == 'protbot' for e in eps), 'no protbot entry point'; \
            print('entry point OK')"

  sbom:
    name: Bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the SBOM
        # Regulation (EU) 2024/2847 (the Cyber Resilience Act) requires a bill
        # of materials in a machine-readable format covering at least the
        # top-level dependencies. Generated from requirements.lock, which is
        # what a release build actually installs — see packaging/sbom.py.
        run: python packaging/sbom.py --output protbot.cdx.json

      - name: Validate it against the official CycloneDX schema
        # The generator is standard library only, so nothing in the build path
        # depends on this. It runs here, where a network is available, because
        # hand-reading a JSON schema is not verification.
        run: |
          python -m pip install --upgrade pip jsonschema cyclonedx-python-lib
          python -m pytest tests/test_sbom.py -v

      - name: Keep the document
        # Retained as a build artifact rather than committed: it is derived
        # from the lockfile, and a generated file in the tree is a file that
        # goes stale between the change and the regeneration.
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: protbot.cdx.json
          if-no-files-found: error

  android-core:
    name: Android shared rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Only the :core module, which is pure Kotlin/JVM and needs no Android
      # SDK. The :app module is excluded from the build unless ANDROID_HOME is
      # set, so this runs the shared rules everywhere.
      - name: Run the shared rule tests
        working-directory: android
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle :core:test --no-daemon || ./gradlew :core:test --no-daemon
