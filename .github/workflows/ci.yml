name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Linux runs the same suite because it
        # is faster and catches anything that is accidentally platform-locked.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # segno and OpenCV verify core/qrcode.py: the tests read generated
        # symbols back with a real decoder and compare against a second
        # encoder. Without them those tests skip, which would let a broken
        # QR encoder through a green build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest segno opencv-python-headless numpy

      - name: Run tests
        run: python -m pytest -v

  syntax:
    name: Syntax check (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Byte-compile every module
        # Catches syntax errors in the Tk UI modules, which the test suite does
        # not import because CI runners have no display.
        run: python -m compileall -q core ui server main.py

  dependencies:
    name: Dependency install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        # requirements.txt is what users actually install. If it drifts from
        # what the code imports, this job fails before a user hits it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import every runtime dependency
        # pystray and Pillow were dropped in favour of core/tray.py (ctypes),
        # so importing them here would now fail. Keep this list matching
        # requirements.txt.
        run: python -c "import psutil, plyer; print('runtime deps OK')"

      - name: Install protbot as a package (AUDIT ST-04)
        # What build.ps1 does before PyInstaller runs. Proves the packaging
        # metadata actually resolves on the shipping OS, not just that the
        # files parse. Doesn't import main.py itself -- that pulls in tkinter,
        # which this runner does not have (see the `test` job's note on the
        # Tk modules the suite cannot import).
        run: |
          python -m pip install -e . --no-deps
          python -c "import core, ui; print('package imports OK')"
          python -c "from importlib.metadata import entry_points as ep; names = ep(group='console_scripts').names; assert 'protbot' in names, list(names); print('entry point OK')"

      - name: Verify the packaging config
        # PyInstaller and Inno Setup cannot run here, but the spec, the
        # installer script and the launcher can be checked for drift.
        run: |
          python -m pip install pytest
          python -m pytest tests/test_packaging_build.py -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit the pinned dependencies
        # requirements.lock is what a release actually installs, so it is what
        # gets audited. Pinning by hash makes builds reproducible and also
        # freezes any advisory published after the pin was taken — this job is
        # what stops that going unnoticed.
        run: pip-audit --requirement requirements.lock --strict --progress-spinner off

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cyclonedx-py
        run: python -m pip install --upgrade pip cyclonedx-bom

      - name: Generate the SBOM
        # Regulation (EU) 2024/2847 (the Cyber Resilience Act) requires one for
        # products with digital elements sold in the EU. requirements.lock is
        # what a release actually installs, so it is what the SBOM describes —
        # the same reasoning as the audit job above. --validate makes
        # cyclonedx-py check the document against the CycloneDX 1.6 schema
        # itself; a malformed BOM fails this step rather than shipping.
        run: |
          python -m cyclonedx_py requirements requirements.lock \
            --pyproject pyproject.toml \
            --of JSON --sv 1.6 --validate \
            -o protbot.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: protbot.cdx.json
          retention-days: 90

  android-core:
    name: Android shared rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Only the :core module, which is pure Kotlin/JVM and needs no Android
      # SDK. The :app module is excluded from the build unless ANDROID_HOME is
      # set, so this runs the shared rules everywhere.
      - name: Run the shared rule tests
        working-directory: android
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle :core:test --no-daemon || ./gradlew :core:test --no-daemon
